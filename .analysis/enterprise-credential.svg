<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8880"/>
    </marker>
  </defs>

  <style>
    .ok { fill: #EEF4EA; stroke: #3B6D11; stroke-width: 1; }
    .bad { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 1; }
    .ptA { font-size: 12.5px; font-weight: 700; fill: #2F5A0C; }
    .ptB { font-size: 12.5px; font-weight: 700; fill: #791F1F; }
    .bok { fill: #FFFFFF; stroke: #8FB177; stroke-width: 1; }
    .bbad { fill: #FFFFFF; stroke: #E09B9B; stroke-width: 1; }
    .tok { font-size: 12px; font-weight: 600; fill: #2F5A0C; }
    .sok { font-size: 10.5px; fill: #46543A; }
    .tbad { font-size: 12px; font-weight: 600; fill: #791F1F; }
    .sbad { font-size: 10.5px; fill: #A32D2D; }
    .arrow { fill: none; stroke: #8A8880; stroke-width: 1.5; }
    .alab { font-size: 11px; fill: #6B6963; }
    .nok { font-size: 11px; fill: #2F5A0C; }
    .nbad { font-size: 11px; fill: #791F1F; }
  </style>

  <rect class="ok" x="40" y="40" width="600" height="150" rx="12"/>
  <text class="ptA" x="58" y="64">推荐 · 密钥不出企业层，执行面只持短期凭据</text>

  <rect class="bok" x="60" y="86" width="140" height="56" rx="8"/>
  <text class="tok" x="130" y="108" text-anchor="middle">用户 worker</text>
  <text class="sok" x="130" y="125" text-anchor="middle">只持短期 token</text>

  <rect class="bok" x="270" y="86" width="140" height="56" rx="8"/>
  <text class="tok" x="340" y="108" text-anchor="middle">模型网关</text>
  <text class="sok" x="340" y="125" text-anchor="middle">注入真 key 后转发</text>

  <rect class="bok" x="480" y="86" width="140" height="56" rx="8"/>
  <text class="tok" x="550" y="108" text-anchor="middle">上游 provider</text>
  <text class="sok" x="550" y="125" text-anchor="middle">只见企业级 key</text>

  <path class="arrow" d="M200 114 L268 114" marker-end="url(#arrow)"/>
  <text class="alab" x="234" y="106" text-anchor="middle">短期 token</text>
  <path class="arrow" d="M410 114 L478 114" marker-end="url(#arrow)"/>
  <text class="alab" x="444" y="106" text-anchor="middle">注入密钥</text>

  <text class="nok" x="58" y="170">worker 被攻破也拿不到企业 key —— 可单独吊销、可计费、可按人限额</text>

  <rect class="bad" x="40" y="210" width="600" height="150" rx="12"/>
  <text class="ptB" x="58" y="234">避免 · 密钥下发到执行面（凭据按 scope 存，没有 principal 维度）</text>

  <rect class="bbad" x="60" y="256" width="140" height="56" rx="8"/>
  <text class="tbad" x="130" y="278" text-anchor="middle">用户 worker</text>
  <text class="sbad" x="130" y="295" text-anchor="middle">从 home 读 key</text>

  <rect class="bbad" x="270" y="256" width="140" height="56" rx="8"/>
  <text class="tbad" x="340" y="278" text-anchor="middle">shell-env 注入</text>
  <text class="sbad" x="340" y="295" text-anchor="middle">每次 bash 都带</text>

  <rect class="bbad" x="480" y="256" width="140" height="56" rx="8"/>
  <text class="tbad" x="550" y="278" text-anchor="middle">模型 / 任意命令</text>
  <text class="sbad" x="550" y="295" text-anchor="middle">可读出 key</text>

  <path class="arrow" d="M200 284 L268 284" marker-end="url(#arrow)"/>
  <text class="alab" x="234" y="276" text-anchor="middle">落盘存 key</text>
  <path class="arrow" d="M410 284 L478 284" marker-end="url(#arrow)"/>
  <text class="alab" x="444" y="276" text-anchor="middle">环境注入</text>

  <text class="nbad" x="58" y="340">一个用户的 agent 被攻破 = 企业 key 泄露，且无法区分是谁用的</text>
</svg>
